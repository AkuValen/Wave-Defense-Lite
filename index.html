<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Wave Defense Lite Game</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <canvas id="game-canvas"></canvas>
    <div class="sidebar">
      <div class="status-area">
        <div class="wave-area">
          <span class="wave"><h1>wave</h1></span>
          <span class="wave-counter"><h1 id="wave">99</h1></span>
        </div>
        <div class="resource-area">
          <div>
            ❤️<span class="hp"><h1 id="heart"></h1></span>
          </div>
          <div>
            🪙<span class="gold"><h1 id="gold">Gold</h1></span>
          </div>
        </div>
      </div>
      <div class="control-area">
        <ul>
          <li><div class="tower" id="tower1" draggable="true">tower1</div></li>
          <li><div class="tower" id="tower2" draggable="true">tower2</div></li>
          <li><div class="tower" id="tower3" draggable="true">tower3</div></li>
          <li><div class="tower" id="tower4" draggable="true">tower4</div></li>
        </ul>
      </div>
    </div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
